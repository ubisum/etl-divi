spring.application.name=etl-divi

spring.jmx.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Rome

# ========================================
# Riduzione log auto-configuration
# ========================================
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework=INFO
logging.level.org.hibernate=ERROR

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Ottimizzazioni Hibernate (opzionali ma utili)
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =========================================================
# Modifica della massima grandezza per un file ricevuto
# =========================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/asset_mgmt?allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# =========================================================
# Download dei dati 
# =========================================================
divi.url =${SPRING_DIVI_URL:https://micgpac-divi-gscloud-preprod.apps.os01.ocp.cineca.it/geoserver-cloud/divi/immobili_tutelati_04_1/wfs}
divi.authorization=${SPRING_DIVI_AUTORIZATION:aWRlbnRpdGFfZGlnaXRhbGU6aWRfZGlnXzcmJTZoZw==}
divi.cron=${SPRING_DIVI_CRON:0 */2 * * * *}
divi.request.elems=${SPRING_DIVI_REQUEST_ELEMS:1000}
divi.request.mode=${SPRING_DIVI_REQUEST_MODE:rest}